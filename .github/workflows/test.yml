name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Test on Node.js ${{ matrix.node }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@${{ matrix.node }}
          cache: true
          require-lockfile: true

      - name: Test
        run: pnpm test
