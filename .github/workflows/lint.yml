name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    name: Lint on Node.js LTS

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@lts
          cache: true
          require-lockfile: true

      - name: Lint and Test
        run: pnpm run lint
